[project]
name = "pokemon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cyanlist", email = "cyanlist@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pokemon = "pokemon:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

# See https://docs.astral.sh/ruff/configuration/ for more options
[tool.ruff]
line-length = 88
indent-width = 4

# Activates rules by for selected category
# Run "uv run ruff linter" to print the full prefix-to-tool list
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

# Include files for ty checks
[tool.ty.src]
include = ["src", "tests"]
